<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="てくてくマヤ">
<meta name="theme-color" content="#fff6e9">
<title>てくてくマヤ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // 明るさ・テーマカラーは描画前に当てて、ちらつきを防ぐ
  try {
    const t = localStorage.getItem('teku-theme'), c = localStorage.getItem('teku-color');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    if (c) document.documentElement.dataset.color = c;
  } catch (e) {}
</script>
<style>
/* ───── 色（DESIGN.md 2章）───── */
:root{
  --acL:#e07b22; --acLd:#a8561a; --acLt:#b8621a; --acD:#f39a3d; --acDd:#a85a10; --acDt:#f39a3d;
  --bg:#fff6e9; --bg-dot:#f7e4c9; --surface:#fff; --ink:#2d3246; --ink2:#4a4c5c; --muted:#867868; --faint:#bcae9e;
  --line:#f1dfc6; --edge:#ecd2ae;
  --accent:var(--acL); --accent-deep:var(--acLd); --accent-text:var(--acLt); --on-accent:#fff; --soft:#fdebe1;
  --negi:#6fa35f; --negi-deep:#4c7a40; --pink:#e06d8a; --pink-deep:#a84a5e; --sky:#4fa3e0; --sky-deep:#2a6f9e;
  --set:#2d3246; --set-deep:#14161f; --sun:#ffd65c; --sun-deep:#c9a21e;
  --ok:#36a35a; --ng:#e8613c; --bubble:#fff; --track:#f6e6cf;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  /* イージング（モーションリファレンスの各動きに対応） */
  --out-cubic:cubic-bezier(.33,1,.68,1); --out-back:cubic-bezier(.34,1.56,.64,1);
  --inout-cubic:cubic-bezier(.65,0,.35,1); --inout-sine:cubic-bezier(.37,0,.63,1); --out-expo:cubic-bezier(.16,1,.3,1);
  --out-quart:cubic-bezier(.25,1,.5,1);
}
/* テーマカラー（DESIGN.md 2.2 の表から） */
:root[data-color="sakura"]{--acL:#d9607a;--acLd:#a23e55;--acLt:#b8455f;--acD:#f39aaf;--acDd:#a84a5e;--acDt:#f5a8ba}
:root[data-color="sora"]{--acL:#2f86b0;--acLd:#1f5f80;--acLt:#236f96;--acD:#6fb9db;--acDd:#2a6582;--acDt:#86c6e4}
:root[data-color="wakaba"]{--acL:#5a9a48;--acLd:#3c6d2f;--acLt:#477d38;--acD:#8cc77a;--acDd:#3f6634;--acDt:#95cf83}
:root[data-theme="dark"]{
  --bg:#1d2030; --bg-dot:#262a3d; --surface:#2a2e43; --ink:#fdf3e6; --ink2:#e3d9cc; --muted:#b9ab9b; --faint:#7f7b88;
  --line:#3a3f58; --edge:#12141e; --accent:var(--acD); --accent-deep:var(--acDd); --accent-text:var(--acDt); --on-accent:#1d2030; --soft:#353a52;
  --negi:#7fb36e; --negi-deep:#3f6634; --pink:#e57d97; --pink-deep:#8e3c50; --sky:#5aa9e0; --sky-deep:#2a5f86;
  --set:#4a5070; --set-deep:#12141e; --ok:#5cc47b; --ng:#ff8160; --bubble:#353a54; --track:#353a52;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d2030; --bg-dot:#262a3d; --surface:#2a2e43; --ink:#fdf3e6; --ink2:#e3d9cc; --muted:#b9ab9b; --faint:#7f7b88;
    --line:#3a3f58; --edge:#12141e; --accent:var(--acD); --accent-deep:var(--acDd); --accent-text:var(--acDt); --on-accent:#1d2030; --soft:#353a52;
    --negi:#7fb36e; --negi-deep:#3f6634; --pink:#e57d97; --pink-deep:#8e3c50; --sky:#5aa9e0; --sky-deep:#2a5f86;
    --set:#4a5070; --set-deep:#12141e; --ok:#5cc47b; --ng:#ff8160; --bubble:#353a54; --track:#353a52;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:22px 22px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500;font-size:16px;line-height:1.7}
/* 画面切り替えの横スライド中に、ページが横にはみ出さないようにする */
html,body{overflow-x:hidden}
/* ダブルタップでの拡大を止める */
html{touch-action:manipulation}
body.mapmode{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
main{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 48px);overflow-x:hidden}
h2{font-size:14px;font-weight:700;color:var(--muted);margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.num{font-family:Fredoka,"Zen Maru Gothic",sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ぷっくりした立体ボタン：押すと沈む（プレスフィードバック） */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 18px;min-height:52px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--accent-deep);
  transition:transform .12s var(--out-cubic),box-shadow .12s var(--out-cubic)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.sub{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--edge);border:2px solid var(--line)}
.btn.sub:active{box-shadow:0 1px 0 var(--edge)}
.btn.green{background:var(--negi);color:#fff;box-shadow:0 4px 0 var(--negi-deep)}
.btn.green:active{box-shadow:0 1px 0 var(--negi-deep)}
.btn.danger{background:var(--surface);color:var(--accent-text);border:2px dashed var(--accent);box-shadow:none}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.btn.fit{font-size:15px;padding:12px 10px}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--edge)}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--edge);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .12s var(--out-cubic),box-shadow .12s}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.round.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-deep)}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent-text);font-weight:700;white-space:nowrap}
.chip.gray{background:var(--track);color:var(--muted)}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;min-height:42px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--edge);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--out-cubic),box-shadow .12s,background .2s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-deep)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,textarea{font:inherit;font-size:16px;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:11px 14px;box-shadow:0 3px 0 var(--edge);background:var(--surface);width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.note{font-size:13px;color:var(--muted);line-height:1.6}

/* ───── キャラクター ───── */
.mascot{display:block;image-rendering:pixelated}
.mascot svg{display:block;width:100%;height:100%;overflow:visible}
.bubble{position:relative;background:var(--bubble);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--edge);line-height:1.5}
.bubble::after{content:"";position:absolute;width:12px;height:12px;background:var(--bubble);border:2px solid var(--line);border-top:0;border-right:0;transform:rotate(45deg)}
.bubble.left::after{left:-8px;top:50%;margin-top:-7px}
.bubble.down::after{left:50%;bottom:-8px;margin-left:-6px;transform:rotate(-45deg)}
.bubble.up::after{right:38px;top:-8px;transform:rotate(135deg)}

/* ───── ホーム ───── */
.hero{display:flex;align-items:flex-end;gap:10px;margin:4px 0 6px}
.logo{font-family:Fredoka,sans-serif;font-weight:700;font-size:40px;letter-spacing:.5px;line-height:1;color:var(--accent);text-shadow:0 3px 0 var(--accent-deep);margin:6px 0 4px;white-space:nowrap}
.logo .bang{display:inline-block;color:var(--sun);text-shadow:0 3px 0 var(--sun-deep);transform-origin:50% 90%}
.tagline{color:var(--muted);font-size:14px}
.hero-mascot{width:92px;height:108px;flex:none;cursor:pointer;margin-left:auto}
.hero-talk{display:flex;justify-content:flex-end;margin:0 0 14px}
.today{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:none}
.ring>svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:var(--track)}
.ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .9s var(--out-cubic)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.today .ring{width:112px;height:112px}
.today .ring .in b{font-size:26px;line-height:1}
.today .ring .in small{font-size:11px;color:var(--muted);font-weight:700}
.today .info{flex:1;min-width:0}
.today .steps{font-size:36px;line-height:1.05}
.today .steps small{font-size:15px;color:var(--muted);font-family:"Zen Maru Gothic",sans-serif;font-weight:700;margin-left:2px}
.today .goal{font-size:13px;color:var(--muted);font-weight:700}
.minis{display:flex;gap:12px;margin-top:6px;font-size:13px;color:var(--ink2);font-weight:700;flex-wrap:wrap}
.minis .num{font-size:16px}
.syncrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.syncrow .btn{flex:1}
.syncrow .when{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4;text-align:right}
.walking-bar{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;border:2px solid var(--negi);background:color-mix(in srgb,var(--negi) 14%,var(--surface));color:var(--ink);
  border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--negi-deep);text-align:left}
.walking-bar .face{width:34px;height:32px}
.walking-bar span{flex:1}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:22px;padding:14px 16px;min-height:128px;text-align:left;color:#fff;
  transition:transform .12s var(--out-cubic),box-shadow .12s var(--out-cubic);overflow:hidden}
.mode:active{transform:translateY(4px)}
.mode .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.mode .ic .i{width:26px;height:26px}
.mode b{font-size:20px;line-height:1.3}
.mode small{font-size:12px;opacity:.95;font-weight:700;line-height:1.4}
.mode::after{content:"";position:absolute;right:-22px;bottom:-22px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.12)}
.mode .new{position:absolute;top:12px;right:12px;background:var(--sun);color:#5a4300;font-size:11px;font-family:Fredoka,sans-serif;font-weight:700;border-radius:99px;padding:1px 8px}
.mode.c1{background:var(--accent);box-shadow:0 5px 0 var(--accent-deep);color:var(--on-accent)}
.mode.c1:active{box-shadow:0 1px 0 var(--accent-deep)}
.mode.c2{background:var(--negi);box-shadow:0 5px 0 var(--negi-deep)}
.mode.c2:active{box-shadow:0 1px 0 var(--negi-deep)}
.mode.c3{background:var(--pink);box-shadow:0 5px 0 var(--pink-deep)}
.mode.c3:active{box-shadow:0 1px 0 var(--pink-deep)}
.mode.c4{background:var(--sky);box-shadow:0 5px 0 var(--sky-deep)}
.mode.c4:active{box-shadow:0 1px 0 var(--sky-deep)}
.mode.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:12px;padding:12px 16px}
.mode.wide .ic{margin:0;width:40px;height:40px}
.mode.wide b{font-size:18px}
.mode.wide small{margin-left:auto;text-align:right}
.mode.wide::after{display:none}
.mode.c5{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--edge)}
.mode.c5 .ic{background:var(--soft);color:var(--accent-text)}
.mode.c5:active{box-shadow:0 1px 0 var(--edge)}
.mode.c6{background:var(--set);box-shadow:0 5px 0 var(--set-deep)}
.mode.c6:active{box-shadow:0 1px 0 var(--set-deep)}

/* ───── サブ画面の見出し ───── */
.topbar{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.topbar .ttl{font-size:20px;font-weight:700;flex:1;min-width:0}
.topbar .face{width:48px;height:44px}
.coinbox{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:3px 12px 3px 5px;box-shadow:0 3px 0 var(--edge);font-weight:700}
.coinbox .num{font-size:18px}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,var(--sun) 20% 100%);border:2px solid var(--sun-deep);position:relative;flex:none}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--sun-deep);opacity:.7}

/* ───── シンプルモード ───── */
.big-talk{display:flex;justify-content:center;margin:2px 0 12px}
.bigring{width:min(78vw,280px);height:min(78vw,280px);margin:0 auto}
.bigring .in .mascot{width:76px;height:88px;margin-bottom:4px}
.bigring .in b{font-size:46px;line-height:1}
.bigring .in small{font-size:14px;color:var(--muted);font-weight:700}
.bigring .done{margin-top:4px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 var(--edge)}
.stat>b{display:block;font-size:24px;line-height:1.15}
.stat>b small{font-size:12px;font-family:"Zen Maru Gothic",sans-serif;margin-left:1px}
.stat>span{font-size:12px;color:var(--muted);font-weight:700}
.livebox{display:flex;align-items:center;gap:12px;margin-top:16px}
.livebox .txt{flex:1;font-size:13px;color:var(--muted);line-height:1.5}
.livebox .txt b{color:var(--ink);font-size:15px;display:block}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:16px;position:relative}
.week .goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);opacity:.55}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .bar{width:100%;max-width:30px;border-radius:9px 9px 4px 4px;background:var(--track);height:0;transition:height .9s var(--out-cubic)}
.week .bar.ok{background:var(--accent)}
.week .col small{font-size:11px;color:var(--muted);font-weight:700}
.week .col.today small{color:var(--accent-text)}
.streak{display:flex;align-items:center;gap:12px}
.streak .face{width:54px;height:50px}
.streak b{font-size:26px}

/* ───── 地図の画面（おでかけ・記録の地図）───── */
.mapscreen{position:fixed;inset:0;z-index:5;background:var(--bg)}
.mapscreen #map{position:absolute;inset:0}
.leaflet-container{background:var(--bg);font-family:"Zen Maru Gothic",sans-serif}
.mtop{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;z-index:1000;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.mtop>*{pointer-events:auto}
.wstats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:6px 4px}
.wstats div{text-align:center;line-height:1.2}
.wstats b{display:block;font-size:20px}
.wstats span{font-size:11px;color:var(--muted);font-weight:700}
.mside{position:absolute;right:12px;top:calc(var(--safe-t) + 86px);z-index:1000;display:flex;flex-direction:column;gap:10px}
.mbottom{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:1000;display:flex;flex-direction:column;gap:10px}
.mbottom .row .btn{min-height:56px}
.restbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--edge);padding:10px 12px}
.restbar .mascot{width:46px;height:54px;flex:none}
.restbar .t{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.5}
.restbar .t small{display:block;color:var(--muted);font-size:12px}
.restbar .acts{display:flex;flex-direction:column;gap:6px}
.me-pin{width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 3px 0 var(--accent-deep);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.me-pin .mascot{width:34px;height:31px}
.spot-pin{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;border:2.5px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.spot-pin .i{width:17px;height:17px}
.st-pin{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--faint)}
.st-pin.on{background:var(--accent);border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.st-pin.goal{width:20px;height:20px;background:var(--pink);border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.leaflet-popup-content-wrapper{border-radius:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--edge);background:var(--surface);color:var(--ink)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.55}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content .btn{margin-top:8px;width:100%}
.pop-sub{color:var(--muted);font-size:12px}

/* ───── 休憩画面：地図を上半分、マヤを下半分に ───── */
.restpanel{display:none}
.mapscreen.resting #map{bottom:calc(50% - 22px)}
.mapscreen.resting .mbottom{display:none}
.mapscreen.resting .restpanel{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:50%;bottom:0;margin-top:-22px;z-index:1001;overflow:hidden;
  background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:22px 22px;
  border-radius:26px 26px 0 0;box-shadow:0 -4px 0 var(--edge);padding:16px 16px 0;animation:sheet-in .42s var(--inout-cubic)}
.rp-maya{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rp-m{border:0;background:none;padding:0;flex:none;cursor:pointer}
.rp-m .mascot{width:96px;height:112px}
.rp-maya .bubble{flex:1}
.rp-maya .bubble small{font-size:12px}
.spot.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep)}
/* スポットのカード：押すと地図が動く部分と、ピン・調べるボタン */
.rp-list .spot{padding:6px 8px 6px 6px;gap:6px}
.rp-list .spot:active{transform:none;box-shadow:0 4px 0 var(--edge)}
.spot-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:4px;color:inherit}
.spot .mini{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 0 var(--edge)}
.spot .mini:active{transform:translateY(2px);box-shadow:none}
.spot .mini.on{background:var(--sun);border-color:var(--sun-deep);color:#5a4300}
.spot .t b .chip{font-size:10px;padding:1px 6px;background:var(--sun);color:#5a4300;vertical-align:2px}
.spot-pin{position:relative}
.spot-pin.pinned{width:40px;height:40px;border:3px solid var(--sun);box-shadow:0 0 0 3px rgba(255,214,92,.45),0 2px 0 rgba(0,0,0,.25)}
.spot-pin.pinned .i{width:20px;height:20px}
.pin-star{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--sun);color:#5a4300;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pin-star .i{width:12px!important;height:12px!important;fill:currentColor}
.leaflet-popup-content .pop-acts{display:flex;gap:6px;margin-top:8px}
.leaflet-popup-content .pop-acts .btn{margin:0;width:auto;flex:1;white-space:nowrap;min-height:36px;padding:4px 8px;font-size:13px;gap:3px;border-radius:12px}
/* マヤとボタンは固定して、スポットの一覧だけをスクロールさせる */
.rp-maya{flex:none}
.rp-list{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:4px 16px 4px}
.rp-ctl{flex:none;padding:10px 0 calc(var(--safe-b) + 14px);background:var(--bg)}

/* ───── 下から出るパネル ───── */
.sheet-wrap{position:fixed;inset:0;z-index:2000}
.sheet-bg{position:absolute;inset:0;background:rgba(29,32,48,.35);animation:fade .3s var(--out-cubic)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:0 16px calc(var(--safe-b) + 20px);
  max-width:560px;margin:0 auto;animation:sheet-in .42s var(--inout-cubic)}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:2px dashed var(--line);margin-bottom:14px;z-index:1}
.sheet-h b{flex:1;font-size:18px}
.sheet-wrap.out .sheet{transform:translateY(100%);transition:transform .25s var(--inout-cubic)}
.sheet-wrap.out .sheet-bg{opacity:0;transition:opacity .25s}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.spot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 0 var(--edge);transition:transform .12s var(--out-cubic),box-shadow .12s}
.spot:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.spot .ic{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.spot .t{flex:1;min-width:0}
.spot .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .t small{color:var(--muted);font-size:12px;font-weight:700}
.steps-guide{margin:0;padding-left:1.4em}
.steps-guide li{margin:8px 0;color:var(--ink2);font-size:15px}
.steps-guide b{color:var(--ink)}
.code{display:block;background:var(--soft);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px;line-height:1.7;font-weight:700;color:var(--ink)}

/* ───── 中央に出るカード（お祝い・詳細）───── */
.popwrap{position:fixed;inset:0;z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px}
.popwrap .bg{position:absolute;inset:0;background:rgba(29,32,48,.4);animation:fade .3s}
.popcard{position:relative;width:100%;max-width:380px;background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--edge);padding:22px 20px 18px;text-align:center;
  animation:pop-scale .52s var(--out-back) both}
.popcard .mascot{width:96px;height:112px;margin:-4px auto 4px}
.popcard h3{margin:4px 0;font-size:22px}
.popcard p{color:var(--ink2)}
.popcard .btn{margin-top:12px}
/* ポップスケール：5% → 108% → 100%（参考の 116% だとカードの端が画面からはみ出すため 108% に抑える） */
@keyframes pop-scale{0%{transform:scale(.05);opacity:0}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.bigstamp{width:120px;height:120px;margin:4px auto 6px;border-radius:50%;border:5px solid var(--ng);color:var(--ng);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);font-weight:700;line-height:1.15}
.bigstamp b{font-size:26px}
.bigstamp small{font-size:12px}

/* ───── 活動履歴 ───── */
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-h b{flex:1;text-align:center;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal .wd:first-child{color:var(--ng)}
.cal .wd:last-child{color:var(--sky)}
.cal .d{position:relative;aspect-ratio:1/1.34;border-radius:12px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 0 0;
  overflow:hidden;transition:transform .12s var(--out-cubic)}
.cal .d:active{transform:scale(.94)}
.cal .d .n{font-size:12px;font-weight:700;color:var(--muted);line-height:1.3}
.cal .d .s{font-size:10px;line-height:1.1;color:var(--ink2);margin-top:auto;margin-bottom:3px}
.cal .d .mascot{width:20px;height:18px}
.cal .d.ok{background:var(--soft);border-color:var(--accent)}
.cal .d.today{box-shadow:0 0 0 2px var(--accent)}
.cal .d.future{opacity:.4;pointer-events:none}
.cal .d.blank{visibility:hidden}
.outing{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px;margin-bottom:12px;box-shadow:0 5px 0 var(--edge);
  transition:transform .12s var(--out-cubic),box-shadow .12s}
.outing:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.outing .thumb{width:84px;height:84px;border-radius:15px;flex:none;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.4px,transparent 1.6px);background-size:12px 12px}
.outing .thumb svg{width:100%;height:100%;display:block}
.outing .t{flex:1;min-width:0}
.outing .t b{display:block}
.outing .t .minis{margin-top:2px}
.empty{text-align:center;padding:26px 10px}
.empty .mascot{width:90px;height:105px;margin:0 auto 8px}

/* ───── すごろく ───── */
.sugo-card .where{display:flex;align-items:center;gap:12px}
.sugo-card .where .face{width:54px;height:48px;flex:none}
.sugo-card .where .t{flex:1;min-width:0}
.sugo-card .where b{font-size:20px;display:block;line-height:1.35}
.sugo-card .lap{font-size:12px}
.hoptrack{position:relative;height:96px;margin:6px 6px 0}
.hoptrack .ln{position:absolute;left:0;right:0;bottom:22px;height:4px;border-radius:9px;background:var(--track)}
.hoptrack .ln i{display:block;height:100%;border-radius:9px;background:var(--accent);width:0}
.hoptrack .wp{position:absolute;bottom:16px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--faint)}
.hoptrack .wp.on{background:var(--accent);border-color:var(--accent)}
.hoptrack .wpl{position:absolute;bottom:-6px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.hoptrack .runner{position:absolute;bottom:30px;width:44px;height:52px;margin-left:-22px;transform-origin:50% 100%}
.prog{height:14px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);width:0;transition:width .9s var(--out-cubic)}
.sugomap{height:300px;border-radius:22px;overflow:hidden;border:2px solid var(--line);box-shadow:0 5px 0 var(--edge)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--faint);line-height:1.1;text-align:center;padding:2px}
.stamp.got{border:3px solid var(--ng);color:var(--ng);background:color-mix(in srgb,var(--ng) 8%,var(--surface));transform:rotate(-8deg)}
.stamp.cur{box-shadow:0 0 0 3px var(--accent)}

/* ───── きせかえ ───── */
.dress{display:flex;align-items:flex-end;gap:14px}
.dress .stage{flex:none;width:150px;height:170px;border-radius:24px;background:var(--soft);background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:14px 14px;
  display:flex;align-items:flex-end;justify-content:center;padding:14px 0 10px;border:2px solid var(--line);box-shadow:0 4px 0 var(--edge)}
.dress .stage .mascot{width:110px;height:128px}
.dress .side{flex:1;min-width:0}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 4px 8px;box-shadow:0 4px 0 var(--edge);
  transition:transform .12s var(--out-cubic),box-shadow .12s}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.item .mascot{width:56px;height:52px}
.item b{font-size:13px;line-height:1.3}
.item small{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:3px}
.item small .coin{width:14px;height:14px;border-width:1.5px}
.item small .coin::after{display:none}
.item.sel{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep)}
.item .badge{position:absolute;top:6px;right:6px;font-size:10px;padding:0 6px}
.item.lock{opacity:.6}

/* ───── ごほうび ───── */
/* ホームにかざった たからもの（吹き出しの左） */
.hero-talk{align-items:center;gap:10px}
.hero-talk .fav{width:40px;height:40px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.hero-talk .fav svg{max-width:100%;max-height:100%}
.lvrow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;flex-wrap:wrap}
.lvrow .lvnext{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.lvrow+.prog{height:10px;margin-top:6px}
.nextcoin{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px}
.nextcoin .t{flex:1;font-size:14px;font-weight:700}
.nextcoin .prog{height:10px;margin-top:6px}
.rare{position:absolute;top:6px;left:8px;font-size:10px;font-weight:700;color:var(--sun-deep);letter-spacing:-1px}
.item .mascot{width:46px;height:54px;margin-top:6px}
.wavebox{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;font-size:14px;line-height:1.6}
.wavebox .face{width:48px;height:44px;flex:none}
.wavebox small{color:var(--muted);font-weight:700}
.shelfhead{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px}
.shelfhead .face{width:48px;height:44px}
.shelfhead b{font-size:24px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:12px 10px 4px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--edge)}
.tr{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:18px 2px 10px;border-bottom:7px solid #d9a05b;border-radius:4px;color:var(--faint);transition:transform .12s var(--out-cubic)}
.tr:active{transform:scale(.94)}
.tr .pic{width:52px;height:52px;display:flex;align-items:flex-end;justify-content:center}
.tr .pic svg{max-width:100%;max-height:100%}
.tr:not(.got) .pic{opacity:.35}
.tr b{font-size:12px;line-height:1.3;color:var(--ink);text-align:center}
.tr small{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:3px}
.tr small .coin,.item small .coin{width:14px;height:14px;border-width:1.5px}
.tr small .coin::after{display:none}
.trbig{width:130px;height:130px;margin:6px auto;display:flex;align-items:flex-end;justify-content:center;color:var(--faint)}
.trbig svg{max-width:100%;max-height:100%}
.trbig.shadow{opacity:.35}
.coach{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.coach .face{width:54px;height:50px;flex:none}
.coach .bubble{flex:1}

/* ───── 設定 ───── */
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .3s var(--out-cubic)}
details.card[open] summary::after{transform:rotate(-135deg)}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted)}
.sw i{width:38px;height:38px;border-radius:50%;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.15);border:3px solid var(--surface)}
.sw.on i{box-shadow:0 0 0 3px var(--ink)}
.sw.on{color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:2px dashed var(--line);font-size:14px}
.kv:first-child{border-top:0}

.toast{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(var(--safe-b) + 24px);width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:16px;font-size:15px;font-weight:700;z-index:3000;animation:pop-scale .52s var(--out-back) both}

/* ───── モーション（https://motion-reference.takayustudio.jp/ を参考） ───── */
/* ルートスライド：進むときは右から、戻るときは左から */
@keyframes route-fwd{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes route-back{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.enter-fwd{animation:route-fwd .42s var(--inout-cubic) both}
.enter-back{animation:route-back .42s var(--inout-cubic) both}
/* 地図の画面は位置を動かすと地図がずれるので、ビュークロスフェード（透明度だけ）にする */
.enter-fade{animation:fade .52s var(--inout-cubic) both}
/* リスト順次表示 */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
[data-anim] .stagger>*{animation:rise .6s var(--out-cubic) both}
[data-anim] .stagger>*:nth-child(2){animation-delay:.06s}[data-anim] .stagger>*:nth-child(3){animation-delay:.12s}[data-anim] .stagger>*:nth-child(4){animation-delay:.18s}
[data-anim] .stagger>*:nth-child(5){animation-delay:.24s}[data-anim] .stagger>*:nth-child(6){animation-delay:.3s}[data-anim] .stagger>*:nth-child(n+7){animation-delay:.36s}
/* 呼吸する拡縮 */
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.breathe{animation:breathe 2.4s var(--inout-sine) infinite;transform-origin:50% 100%}
/* ゼリー強調：キャラをタップしたとき */
@keyframes jelly{0%{transform:scale(1,1)}25%{transform:scale(1.15,.85)}45%{transform:scale(.9,1.1)}62%{transform:scale(1.05,.95)}80%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
.jelly{animation:jelly .76s var(--out-cubic);transform-origin:50% 100%}
/* アテンションバウンス：うれしいとき */
@keyframes hop{0%{transform:none}35%{transform:translateY(-16px)}60%{transform:translateY(0) scale(1.08,.92)}78%{transform:translateY(-4px)}100%{transform:none}}
.hop{animation:hop .62s var(--out-cubic);transform-origin:50% 100%}
/* てくてく歩き：ウェイポイントホップの1区間（跳ね 250ms＋着地 50ms、着地で scaleY .92）をくり返す。
   参考の高さ -24px は地点間の移動用なので、その場の足踏みとして -5px に小さくしている */
@keyframes walk{0%{transform:translateY(0) scaleY(1)}42%{transform:translateY(-5px) scaleY(1)}83%{transform:translateY(0) scaleY(1)}92%{transform:translateY(0) scaleY(.92)}100%{transform:translateY(0) scaleY(1)}}
.walking{animation:walk .3s var(--out-cubic) infinite;transform-origin:50% 100%}
/* コインスピン：rotateY 0 → 1080°、900ms、easeOutQuart */
@keyframes coinspin{from{transform:perspective(320px) rotateY(0)}to{transform:perspective(320px) rotateY(1080deg)}}
.coin.spin{animation:coinspin .9s var(--out-quart)}
/* ロゴの「!」がたまに弾む */
@keyframes bang{0%,70%,100%{transform:none}78%{transform:translateY(-8px) rotate(8deg)}86%{transform:translateY(0) scale(1.1,.9)}92%{transform:translateY(-2px)}}
.logo .bang{animation:bang 3.6s var(--out-cubic) infinite}
/* ポップスケール（吹き出し） */
.pop{animation:pop-scale .52s var(--out-back) both}
/* 紙吹雪（パーティクルバースト） */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:2200;overflow:hidden}
.confetti i{position:absolute;top:35%;left:50%;width:10px;height:14px;border-radius:3px;animation:burst 1.2s var(--out-cubic) forwards}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

function day(k) { return S.days[k] ||= { h: 0, l: 0, g: S.set.goal }; }
const stepsOf = k => { const d = S.days[k]; return d ? (d.h || 0) + (d.l || 0) : 0; };
const goalOf = k => S.days[k]?.g || S.set.goal;
const stride = () => S.set.height * 0.45 / 100;                  // 歩幅（m）：身長 × 0.45

function streak() {

  let k = todayKey(), n = 0;
  if (stepsOf(k) < goalOf(k)) k = addDays(k, -1);
  while (S.days[k] && stepsOf(k) >= goalOf(k)) { n++; k = addDays(k, -1); }
  return n;
}

// ───── 歩いた記録のまとめ（コイン・記念の品・なかよしレベルの計算に使う）─────
function lifeStats() {
  let total = 0, days = 0, maxStreak = 0, weekBonus = 0, run = 0, prevKey = null;
  for (const k of Object.keys(S.days).sort()) {
    const s = stepsOf(k);
    total += s;
    if (s > 0) days++;
    if (s >= goalOf(k)) {
      run = prevKey && run && addDays(prevKey, 1) === k ? run + 1 : 1;
      if (run % 7 === 0) weekBonus++;   // 7日続くたびに1枚
      maxStreak = Math.max(maxStreak, run);
    } else run = 0;
    prevKey = k;
  }
  return { total, days, maxStreak, weekBonus, laps: sugoState().lap };
}

function sugoState() {
  const start = S.set.sugoStart || todayKey();
  let steps = 0;
  for (const k of Object.keys(S.days)) if (k >= start) steps += stepsOf(k);
  const km = kmOf(steps), lap = Math.floor(km / LAP_KM), pos = km - lap * LAP_KM;
  let idx = 0;
  while (idx + 1 < TOKAIDO.length && TOKAIDO[idx + 1][1] <= pos) idx++;

  const frac = next ? (pos - TOKAIDO[idx][1]) / (next[1] - TOKAIDO[idx][1]) : 1;
  return { steps, km, lap, pos, idx, next, frac, reachedTotal: lap * (TOKAIDO.length - 1) + idx };
}

// ショートカットApp がクリップボードに入れた文字から、日付と歩数を読み取る
function parseHealth(text) {
  const t = String(text || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/，/g, ',').replace(/\r/g, '');
  const dateRe = /(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})日?/g;
  const toKey = m => `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  const toNum = s => Math.round(parseFloat(s.replace(/,/g, '')));
  const out = {};
  // ① 1行に「日付＝歩数」が並ぶ形
  for (const line of t.split('\n')) {
    const m = [...line.matchAll(dateRe)][0];
    if (!m) continue;
    const rest = line.slice(m.index + m[0].length).replace(/^\s*[=＝:：,、\t ]*\s*/, '').trim();
    if (/^[\d,]+(\.\d+)?\s*(歩|steps?)?$/i.test(rest)) out[toKey(m)] = toNum(rest);
  }
  // ② 日付の一覧、「＝」、歩数の一覧の順に並ぶ形（ショートカットで作る形）
  if (!Object.keys(out).length) {
    const sep = t.search(/^\s*[=＝]\s*$/m);
    if (sep >= 0) {
      const dates = [...t.slice(0, sep).matchAll(dateRe)].map(toKey);
      const vals = t.slice(sep).split('\n').slice(1).map(s => s.trim()).filter(s => /^[\d,]+(\.\d+)?/.test(s)).map(s => toNum(s.match(/^[\d,]+(\.\d+)?/)[0]));
      dates.forEach((k, i) => { if (vals[i] != null) out[k] = vals[i]; });
    }
  }
  // ③ 数字だけなら今日の歩数
  if (!Object.keys(out).length) {
    const m = t.trim().match(/^[\d,]+(\.\d+)?\s*歩?$/);
    if (m) out[todayKey()] = toNum(m[0]);
  }
  const today = todayKey();
  for (const k of Object.keys(out)) if (k > today || !(out[k] >= 0 && out[k] < 300000)) delete out[k];
  return out;
}
async function applyHealth(map) {
  const keys = Object.keys(map).sort();

  const before = sugoState().reachedTotal, today = todayKey();
  for (const k of keys) {
    const d = day(k);
    d.h = map[k]; d.hAt = Date.now();
    d.l = 0;   // アプリで数えた分は、その日のヘルスケアの数字にすでに含まれている（過去の日も同じ）
  }
  await dbSet('days', S.days);
  const after = sugoState().reachedTotal;
  const extra = after > before ? `　すごろくも${after - before}宿進んだよ！` : '';
  toast(keys.includes(today) ? `今日は ${fmt(stepsOf(today))}歩！${keys.length > 1 ? `（${keys.length}日分もらったよ）` : ''}${extra}` : `${keys.length}日分の歩数をもらったよ！${extra}`);
  return true;
}

const SPOT_KINDS = {
  cafe: { name: 'カフェ', ic: 'coffee', c: '#a8561a', line: n => `ひと休みに「${n}」はどう？` },
  sweets: { name: 'スイーツ', ic: 'ice', c: '#e06d8a', line: n => `甘いもの食べたいな〜。「${n}」があるよ！` },
  bakery: { name: 'パン屋さん', ic: 'bread', c: '#c9902a', line: n => `パンのいい匂いがしそう！「${n}」` },
  park: { name: '公園', ic: 'tree', c: '#5a9a48', line: n => `「${n}」でのんびりしよっか` },
  shrine: { name: '神社', ic: 'torii', c: '#e8613c', line: n => `「${n}」にお参りしていこ！` },

// Photon の「近いもの検索（reverse）」で、種類（OSMのタグ）をしぼって探す。
// 食べもの系と、公園・神社などの系統に分けて2回聞く（1回だとカフェばかりになるため）
const PHOTON = 'https://photon.komoot.io/reverse';
const SPOT_TAGS = [
  ['amenity:cafe', 'amenity:ice_cream', 'shop:bakery', 'shop:confectionery', 'shop:pastry'],
  ['leisure:park', 'leisure:garden', 'amenity:place_of_worship', 'tourism:viewpoint', 'tourism:museum', 'tourism:attraction', 'historic:castle', 'historic:monument', 'historic:ruins'],
];
function kindOf(key, val, name) {
  if (val === 'cafe') return 'cafe';
  if (val === 'ice_cream' || val === 'confectionery' || val === 'pastry') return 'sweets';
  if (val === 'bakery') return 'bakery';
  if (val === 'park' || val === 'garden') return 'park';
  if (val === 'place_of_worship') return /寺|院|観音|不動|大師|堂/.test(name) ? 'temple' : /神社|宮|稲荷|八幡|社$/.test(name) ? 'shrine' : null;
  if (val === 'viewpoint') return 'view';
  if (key === 'tourism' || key === 'historic') return 'museum';
  return null;
}
async function findSpots(lat, lng) {
  const ck = `${lat.toFixed(3)},${lng.toFixed(3)}`;
  if (G.spotCache[ck]) return G.spotCache[ck];
  const ask = async tags => {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
    try {
      const u = `${PHOTON}?lat=${lat.toFixed(5)}&lon=${lng.toFixed(5)}&radius=0.8&limit=30&` + tags.map(t => 'osm_tag=' + t).join('&');
      const r = await fetch(u, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return (await r.json()).features || [];
    } finally { clearTimeout(tm); }
  };
  const got = await Promise.allSettled(SPOT_TAGS.map(ask));
  if (got.every(g => g.status === 'rejected')) throw got[0].reason;
  const seen = new Set(), list = [];
  for (const f of got.flatMap(g => g.status === 'fulfilled' ? g.value : [])) {
    const p = f.properties || {}, [lo, la] = f.geometry?.coordinates || [], kind = p.name && kindOf(p.osm_key, p.osm_value, p.name);
    if (!kind || la == null || seen.has(p.name)) continue;
    seen.add(p.name);
    list.push({ name: p.name, kind, lat: la, lng: lo, area: p.city || p.district || p.locality || p.county || '', dist: hav([lat, lng], [la, lo]) });
  }
  list.sort((x, y) => x.dist - y.dist);
  // いろいろな種類が出るように、まず種類ごとにいちばん近いものを選んでから、
  // 1種類3件までの範囲で残りを近い順に足す
  const out = [], cnt = {};
  for (const s of list) if (!cnt[s.kind]) { cnt[s.kind] = 1; out.push(s); }
  for (const s of list) if (out.length < 14 && !out.includes(s) && cnt[s.kind] < 3) { cnt[s.kind]++; out.push(s); }
  out.sort((x, y) => x.dist - y.dist);
  return G.spotCache[ck] = out;
}

function trackSvg(segs) {
  const pts = segs.flat();
  if (pts.length < 2) return '';
  const cos = Math.cos(pts[0][0] * Math.PI / 180);
  const xs = pts.map(p => p[1] * cos), ys = pts.map(p => -p[0]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY) || 1e-6, sc = 80 / span;
  const ox = (100 - (maxX - minX) * sc) / 2, oy = (100 - (maxY - minY) * sc) / 2;
  const P = p => `${(ox + (p[1] * cos - minX) * sc).toFixed(1)},${(oy + (-p[0] - minY) * sc).toFixed(1)}`;
  const lines = segs.filter(s => s.length > 1).map(s => `<polyline points="${s.map(P).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const a = pts[0], b = pts[pts.length - 1];
  return `<svg viewBox="0 0 100 100">${lines}<circle cx="${P(a).split(',')[0]}" cy="${P(a).split(',')[1]}" r="5" fill="var(--negi)" stroke="#fff" stroke-width="2"/><circle cx="${P(b).split(',')[0]}" cy="${P(b).split(',')[1]}" r="5" fill="var(--pink)" stroke="#fff" stroke-width="2"/></svg>`;
}

// ウェイポイントホップ：いまの宿場からマヤの位置まで、小さく跳ねて進む
// （1区間 250ms ＋ 着地 50ms、高さ -24px、着地で scaleY .92。区間は最大3回）
function hopRunner(xs, targetX) {
  const el = document.getElementById('runner'), box = document.getElementById('hoptrack');
  if (!el || !box || reduced()) return;
  const W = box.clientWidth, start = xs[0];
  const hops = Math.max(1, Math.min(3, Math.round((targetX - start) / 14)));
  const pts = Array.from({ length: hops + 1 }, (_, i) => start + (targetX - start) * i / hops);
  const HOP = 250, LAND = 50, T0 = 300, total = T0 + hops * (HOP + LAND) + 120;
  const outCubic = q => 1 - Math.pow(1 - q, 3);
  const t0 = performance.now();
  el.style.left = start + '%';
  const frame = now => {
    const t = now - t0;
    let x = start, y = 0, sy = 1;
    for (let i = 0; i < hops; i++) {
      const s0 = T0 + i * (HOP + LAND);
      if (t < s0) break;
      const q = Math.min(1, (t - s0) / HOP);
      x = pts[i] + (pts[i + 1] - pts[i]) * outCubic(q);
      y = -24 * Math.sin(Math.PI * q);
      if (q >= 1) { const lq = Math.min(1, (t - s0 - HOP) / 120); sy = 1 - 0.08 * Math.sin(Math.PI * lq); }
    }
    el.style.left = x + '%';
    el.style.transform = `translateY(${y}px) scale(${1 / sy}, ${sy})`;
    if (t < total) requestAnimationFrame(frame);
    else { el.style.left = targetX + '%'; el.style.transform = ''; }
  };
  requestAnimationFrame(frame);
}

  const fresh = ALL_GOODS.find(it => unlocked(it, st) && !(S.wallet.seenLocks || []).includes(it.id));
  if (fresh) {
    S.wallet.seenLocks = [...(S.wallet.seenLocks || []), fresh.id]; dbSet('wallet', S.wallet);
    sfx('fanfare'); confetti();
    const pic = fresh.slot ? `<div class="mascot" style="width:96px;height:112px;margin:0 auto">${spriteSvg('happy', false, { [fresh.slot]: fresh.id })}</div>` : `<div class="trbig">${pixelSvg(fresh.shape, fresh.ink)}</div>`;
    popCard(`${pic}<h3>記念の品「${esc(fresh.name)}」！</h3><p>${esc(LOCKS[fresh.lock].text.replace('もらえる', 'もらえたよ'))}！<br>「ごほうび」で見てみてね</p>`, celebrateMilestones);
    return;
  }
  const rw = releasedWaves();
  if (rw > (S.wallet.seenWave || 0)) {
    const items = ALL_GOODS.filter(it => it.wave > (S.wallet.seenWave || 0) && it.wave <= rw);
    S.wallet.seenWave = rw; dbSet('wallet', S.wallet);
    sfx('fanfare'); confetti();
    popCard(`${mascot('happy')}<h3>${WAVES[rw - 1][1]}が届いたよ！</h3><p>新しいアイテムが${items.length}こ！<br>${items.map(it => esc(it.name)).join('、')}<br>「ごほうび」で見てみてね</p>`, celebrateMilestones);
    return;
  }
  if (lv > (S.wallet.lvSeen || 1)) {
    S.wallet.lvSeen = lv; dbSet('wallet', S.wallet);
    sfx('fanfare'); confetti();
    popCard(`${mascot('happy')}<h3>なかよしレベル <span class="num">${lv}</span>！</h3><p>${callName()}とマヤ、もっとなかよしになったね！<br>いまの称号は「${lvTitle(lv)}」だよ</p>`, () => render('none'));
  }
}

// ───── 設定 ─────
function renderSettings() {
  const st = S.set, theme = getPref('teku-theme', 'auto'), color = getPref('teku-color', 'mikan');
  const COLORS = [['mikan', 'みかん', '#e07b22'], ['sakura', 'さくら', '#d9607a'], ['sora', 'そら', '#2f86b0'], ['wakaba', 'わかば', '#5a9a48']];
  app.innerHTML = topbar('設定', 'home', face('normal')) + `
    <div class="stagger">
      <div class="card">
        <label class="f" for="s-name" style="margin-top:0">マヤからの呼ばれ方</label>
        <input id="s-name" maxlength="12" placeholder="トレーナー" value="${esc(st.name)}">
        <p class="note">家族それぞれのiPhoneで、自分の名前にしてね（「${esc(callName())}」と呼ばれます）。</p>
        <label class="f">1日の目標歩数</label>
        <div class="seg4">${[4000, 6000, 8000, 10000].map(g => `<button class="pill ${st.goal === g ? 'on' : ''}" data-act="goal" data-id="${g}"><span class="num">${fmt(g)}</span></button>`).join('')}</div>
        <input id="s-goal" type="number" inputmode="numeric" min="500" max="50000" step="500" value="${st.goal}" style="margin-top:10px">
        <div class="seg2" style="margin-top:4px">
          <div><label class="f" for="s-height">身長（cm）</label><input id="s-height" type="number" inputmode="numeric" min="90" max="220" value="${st.height}"></div>
          <div><label class="f" for="s-weight">体重（kg）</label><input id="s-weight" type="number" inputmode="numeric" min="15" max="200" value="${st.weight}"></div>
        </div>
        <p class="note">身長から歩幅（${Math.round(stride() * 100)}cm）を、体重から消費カロリーを計算します。</p>
      </div>
      <details class="card" style="margin-top:14px"><summary>${icon('target')}位置情報が使えないとき</summary>${LOC_HELP}</details>
      <details class="card" style="margin-top:14px"><summary>${icon('sync')}歩数の連携（ショートカット）</summary>${GUIDE}
        <button class="btn sub block" style="margin-top:8px" data-act="paste">${icon('clip')}手で貼り付けて受け取る</button></details>
      <div class="card" style="margin-top:14px">
        <label class="f" style="margin-top:0">明るさ</label>
        <div class="seg3">${[['auto', '自動'], ['light', 'ライト'], ['dark', 'ダーク']].map(([k, l]) => `<button class="pill ${theme === k ? 'on' : ''}" data-act="theme" data-id="${k}">${l}</button>`).join('')}</div>
        <label class="f">テーマカラー</label>
        <div class="seg4">${COLORS.map(([k, l, c]) => `<button class="sw ${color === k ? 'on' : ''}" data-act="color" data-id="${k}" style="--c:${c}"><i></i>${l}</button>`).join('')}</div>
        <label class="f">効果音</label>
        <div class="seg2">${[[true, 'オン'], [false, 'オフ']].map(([v, l]) => `<button class="pill ${st.sound === v ? 'on' : ''}" data-act="sound" data-id="${v}">${l}</button>`).join('')}</div>
      </div>
      <div class="card" style="margin-top:14px">
        <label class="f" for="s-sugo" style="margin-top:0">すごろくのスタート日</label>
        <input id="s-sugo" type="date" value="${st.sugoStart}" max="${todayKey()}">
        <p class="note">この日からの歩数で東海道を進みます。変えると、すごろくの位置とコインの数も変わります。</p>
      </div>
      <div class="card" style="margin-top:14px">
        <b>データ</b>
        <p class="note">記録はこのiPhoneの中だけに保存されます。機種変更やSafariのデータ削除に備えて、ときどきバックアップを「ファイル」アプリに保存してください。</p>
        <div class="row"><button class="btn sub" data-act="export">${icon('down')}書き出す</button><button class="btn sub" data-act="import">${icon('up')}読み込む</button></div>
      </div>
      <p class="note" style="margin-top:16px">地図：国土地理院 ／ スポット：© OpenStreetMap contributors（検索：Photon by komoot）</p>
    </div>`;
  const num = (id, lo, hi, key) => {
    const el = document.getElementById(id);
    el.onchange = () => {
      const v = Math.round(+el.value);
      if (!(v >= lo && v <= hi)) { el.value = S.set[key]; return toast(`${lo}〜${hi}の数字にしてね`); }
      S.set[key] = v; if (key === 'goal') day(todayKey()).g = v;
      saveSet(); render('none');
    };
  };
  num('s-goal', 500, 50000, 'goal'); num('s-height', 90, 220, 'height'); num('s-weight', 15, 200, 'weight');
  document.getElementById('s-name').onchange = e => { S.set.name = e.target.value.trim().slice(0, 12); saveSet(); };
  document.getElementById('s-sugo').onchange = e => { if (e.target.value) { S.set.sugoStart = e.target.value; S.sugo.seen = sugoState().reachedTotal; dbSet('sugo', S.sugo); saveSet(); } };
}
function getPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function setPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function saveSet() { setPref('teku-settings', JSON.stringify(S.set)); }
function applyTheme() {
  const t = getPref('teku-theme', 'auto'), c = getPref('teku-color', 'mikan'), de = document.documentElement;
  if (t === 'auto') delete de.dataset.theme; else de.dataset.theme = t;
  if (c === 'mikan') delete de.dataset.color; else de.dataset.color = c;
  setTimeout(() => document.querySelector('meta[name="theme-color"]').content = getComputedStyle(de).getPropertyValue('--bg').trim(), 0);
}

// ───── バックアップ ─────
function exportData() {
  const data = { format: 'teku-maya/1', at: new Date().toISOString(), set: S.set, days: S.days, outings: S.outings, wallet: S.wallet, sugo: S.sugo };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const name = `てくてくマヤ_${todayKey()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('file-backup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.format !== 'teku-maya/1') throw new Error('てくてくマヤのバックアップではありません');
    // 歩数は日ごとに多い方、おでかけは記録ごとに足し合わせる
    for (const [k, v] of Object.entries(d.days || {})) if (!S.days[k] || (v.h || 0) + (v.l || 0) > stepsOf(k)) S.days[k] = v;
    for (const o of d.outings || []) if (!S.outings.some(x => x.id === o.id)) S.outings.push(o);
    S.outings.sort((a, b) => b.start - a.start);
    if (d.wallet && d.wallet.spent >= S.wallet.spent) S.wallet = d.wallet;
    if (d.sugo) S.sugo = d.sugo;
    if (d.set) { S.set = { ...DEFAULT_SET, ...d.set }; saveSet(); }
    await Promise.all([dbSet('days', S.days), dbSet('outings', S.outings), dbSet('wallet', S.wallet), dbSet('sugo', S.sugo)]);
    toast('バックアップを読み込んだよ'); render('none');
  } catch (err) { toast(err.message); }
});

// ───── ボタンの操作 ─────
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'go': return go(id);
    case 'sync': return syncSteps();
    case 'paste': return openPasteSheet();
    case 'ped':
      if (Ped.on) Ped.stop(); else await Ped.start();
      return render('none');
    case 'w-start': return walkStart();
    case 'w-pause': return walkPause();
    case 'w-resume': return walkResume();
    case 'w-finish': return walkFinish();
    case 'rest-close': document.getElementById('restbar').innerHTML = ''; return;
    case 'maya-spot': return mayaSpot();
    case 'spot': return focusSpot(+id);
    case 'pin': return togglePin(G.restList[+id]);
    case 'web': return openWeb(G.restList[+id]);
    case 'locate':
      G.follow = true; b.classList.add('on');
      if (G.lastFix && G.map) G.map.setView(G.lastFix, 17);
      return;
    case 'htab': S.hist.tab = id; return render('none');
    case 'ym': { const [y, m] = S.hist.ym.split('-').map(Number), d = new Date(y, m - 1 + +id, 1); S.hist.ym = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; return render('none'); }
    case 'day': return openDayEdit(id);
    case 'outing': S.outingId = id; return go('outing');
    case 'del-outing':
      if (!confirm('このおでかけの記録を消しますか？（もとに戻せません）')) return;
      S.outings = S.outings.filter(o => o.id !== S.outingId); await dbSet('outings', S.outings);
      toast('記録を消しました'); return go('history');
    case 'stamp': return openStamp(+id);
    case 'ktab': S.kise.tab = id; S.kise.try = null; return render('none');
    case 'tr': return openTreasure(id);
    case 'slot': S.kise.slot = id; S.kise.try = null; return render('none');
    case 'try': S.kise.try = S.kise.try === id ? null : id; render('none'); return replay(document.getElementById('dress-m'), 'jelly');
    case 'buy': return buyItem(id);
    case 'wear': {
      const it = ITEMS.find(i => i.id === id);
      if (S.wallet.wear[it.slot] === id) delete S.wallet.wear[it.slot]; else S.wallet.wear[it.slot] = id;
      await dbSet('wallet', S.wallet); render('none'); return replay(document.getElementById('dress-m'), 'hop');
    }
    case 'goal': S.set.goal = +id; day(todayKey()).g = +id; saveSet(); return render('none');
    case 'theme': setPref('teku-theme', id); applyTheme(); return render('none');
    case 'color': setPref('teku-color', id); applyTheme(); return render('none');
    case 'sound': S.set.sound = id === 'true'; saveSet(); return render('none');
    case 'export': return exportData();
    case 'import': return document.getElementById('file-backup').click();
  }
});

document.addEventListener('gesturestart', e => e.preventDefault());
// アプリに戻ってきたとき：数字を新しくし、記録中なら画面を消さない設定をかけ直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.walk?.status === 'rec') { keepAwake(true); if (G.watch == null) startWatch(); }
  if (['home', 'simple'].includes(S.screen)) render('none');
});

// ───── 起動 ─────
(async function boot() {
  try { S.set = { ...DEFAULT_SET, ...JSON.parse(getPref('teku-settings', '{}')) }; } catch (e) {}
  if (!S.set.sugoStart) { S.set.sugoStart = todayKey(); saveSet(); }
  applyTheme();
  try {
    const [days, outings, wallet, sugo, walk] = await Promise.all(['days', 'outings', 'wallet', 'sugo', 'walk'].map(dbGet));
    S.days = days || {}; S.outings = outings || []; S.wallet = { ...S.wallet, ...wallet }; S.sugo = sugo || { seen: 0 };
    if (!wallet) S.wallet.seenWave = releasedWaves();   // 使い始めた人には、もう届いている分のお知らせは出さない
    // 2版目でコインの数え方を「1,000歩で1枚」から「10,000歩で1枚」に変えた。持っている小物はそのままで、使ったコインは0に戻す
    if (wallet && wallet.v !== 2) {
      const st = lifeStats();
      Object.assign(S.wallet, { v: 2, spent: 0, lvSeen: levelOf(st.total), seenLocks: ALL_GOODS.filter(it => unlocked(it, st)).map(it => it.id) });
      S.sugo.lapSeen = S.sugo.lapPrev = st.laps;
      await Promise.all([dbSet('wallet', S.wallet), dbSet('sugo', S.sugo)]);
    }
    // 途中で閉じたおでかけは、一時停止の状態で続きから
    if (walk) { S.walk = walk; if (walk.status === 'rec') { walk.elapsed = walk.elapsed + Math.max(0, (walk.savedAt || Date.now()) - walk.resumeAt); walk.status = 'pause'; } }
  } catch (e) { toast('保存データを読み込めませんでした'); }
  render('fwd');
  // URLの後ろに #steps=… が付いていたら受け取る（Safariで開いたとき用）
  const hm = location.hash.match(/steps=([^&]+)/);
  if (hm) { history.replaceState(null, '', location.pathname); if (await applyHealth(parseHealth(decodeURIComponent(hm[1]).replace(/;/g, '\n')))) render('none'); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
